location = /cupcake-maintenance.html {
    root /opt/cupcake/maintenance;
    internal;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 10 always;
}

location @cupcake_backend_down {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 10 always;
    return 503 '{"error": "The appliance is restarting. Try again in a moment.", "maintenance": true}';
}
