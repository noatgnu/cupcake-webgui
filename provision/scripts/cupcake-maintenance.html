<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="20">
  <title>Cupcake is restarting</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif;
           background: #f5f6f8; color: #1f2933; }
    main { text-align: center; padding: 2rem; max-width: 28rem; }
    h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
    p { margin: 0.25rem 0; color: #5f6b7a; }
    .spinner { width: 2.5rem; height: 2.5rem; margin: 0 auto; border: 3px solid #c9d1db; border-top-color: #1976d2;
               border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      body { background: #12161c; color: #e8eef2; }
      p { color: #8a96a3; }
      .spinner { border-color: #2a323d; border-top-color: #42a5f5; }
    }
  </style>
</head>
<body>
  <main>
    <div class="spinner" role="status" aria-label="Restarting"></div>
    <h1>Cupcake is restarting</h1>
    <p>This page reconnects by itself as soon as the appliance is ready.</p>
  </main>
  <script>
    setInterval(function () {
      fetch('/api/v1/appliance/network-info/', { cache: 'no-store' })
        .then(function (response) { if (response.ok) { location.reload(); } })
        .catch(function () {});
    }, 4000);
  </script>
</body>
</html>
