name: Test RPi Image

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: 'Backend branch/tag (cupcake_vanilla)'
        type: string
        default: 'master'
      webgui_ref:
        description: 'WebGUI branch/tag (cupcake-webgui)'
        type: string
        default: 'master'
      vanilla_ng_ref:
        description: 'Vanilla NG branch/tag (cupcake-vanilla-ng)'
        type: string
        default: 'master'
      native_arm:
        description: 'Build natively on an ARM runner; untick to test the QEMU fallback on x86'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  rpi:
    name: Build and test the RPi image
    uses: ./.github/workflows/build-appliance-images.yml
    with:
      image_type: rpi
      native_arm: ${{ inputs.native_arm }}
      backend_ref: ${{ inputs.backend_ref }}
      webgui_ref: ${{ inputs.webgui_ref }}
      vanilla_ng_ref: ${{ inputs.vanilla_ng_ref }}
    secrets: inherit
